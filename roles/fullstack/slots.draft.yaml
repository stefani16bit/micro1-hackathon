# DRAFT - human review of the L1 extraction. Approve, then rename to slots.yaml and commit.
# This file is the denominator of the primary metric. Once frozen it is read-only.
#
# The raw L1 output is preserved in slots.l1-raw.yaml. Four defects were corrected here:
#   1. "integration" appeared as a keyword in two different slots, making the denominator
#      ambiguous. Keywords are now disjoint across slots.
#   2. typescript_javascript was dropped as a slot. Every frontend and backend answer
#      mentions TS/JS, so a slot that any answer satisfies inflates coverage for free.
#   3. full_stack_integration and api_integration measured the same thing; merged into
#      api_contract.
#   4. L1 read the required_skills list and under-weighted the Scope of Work. The posting
#      names the database layer twice and had no slot; documentation and code review were
#      cut as surplus although in this role - producing AI training data - they are the
#      deliverable. Both are restored.
