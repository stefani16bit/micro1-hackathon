# Runtime configuration. Everything a run depends on lives here, so a reviewer can
# see the full parameterisation of an experiment without reading code.

provider:
  # "ollama" (local HTTP) or "claude_cli" (the Claude Code CLI in non-interactive mode).
  # No hosted AI APIs are used anywhere in this project.
  #
  # Model ids are pinned to dated snapshots, never to moving aliases like "sonnet" or
  # "claude-sonnet-4-5": an alias resolves to whatever is current, so a reviewer running
  # this later would silently get a different model and different numbers.
  name: claude_cli
  ollama:
    base_url: http://localhost:11434
    model: gemma4:12b
    temperature: 0.0
    seed: 42
  claude_cli:
    binary: claude
    model: claude-sonnet-4-5-20250929

# The judge runs on the same model as the interviewer, deliberately. Self-preference bias
# is a phenomenon of quality judgement; this judge performs blind classification - it sees
# one question and the competency list, with no transcript, no iteration number and nothing
# identifying the system that produced it, so it cannot know whether it is labelling its
# own output. Distorting the comparison would require the bias to act differently at the
# two ends of the ladder, and blindness leaves no mechanism for that.
#
# The gain is real: a stronger judge resolves the hard cases better, and the hard cases are
# exactly what reaches it - questions spanning three or four slots that the rule escalates.
#
# What this removes is the cross-model check, so D11 (the result is about the architecture,
# not about one model) is deferred rather than demonstrated. See PREREGISTRATION.md 3d.
judge:
  provider: claude_cli

interview:
  total_seconds: 1500          # 25 minutes - the only limit that is enforced
  # A forecast, never a limit. The candidate answers at their own pace and submits when
  # they are done; nothing compares an answer against this number. It exists so the
  # scheduler can plan how many turns are likely to fit. The interview being modelled is
  # spoken, and a spoken interview advances when the candidate stops talking.
  expected_answer_seconds: 120
  turn_overhead_seconds: 15    # time the interviewer itself consumes per turn
  max_followups_per_slot: 1
  # The budget technically fits ~10 primary questions at 135 s each. Six leaves room for
  # follow-ups; competencies beyond the sixth are recorded in slots.yaml as excluded.
  max_slots: 6
  # The opening answer's time cost is not configured: it is whatever the answer actually
  # took when the baseline captured it, recorded in evals/experiment-lock.yaml and charged
  # identically in every replay. A number chosen here would make the stimulus cost one
  # thing in the run that produced it and another in the ten that replay it.

# Which rung `interview run --baseline` and `--solution` resolve to. They exist because
# the reproduction guide has to name stable commands: the brief asks for the exact commands
# for solution, baseline and evaluation, and those names must keep working even if the
# final rung turns out not to be the tenth.
iterations:
  baseline: 0
  solution: 3

role: roles/fullstack
case: evals/cases/case-01

# The experiment the ladder is measuring: the digests of every input PREREGISTRATION.md
# section 1 fixes. Written by `interview freeze`, checked by every measured run. See
# solution/application/experiment.py.
experiment_lock: evals/experiment-lock.yaml
