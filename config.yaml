# Runtime configuration. Everything a run depends on lives here, so a reviewer can
# see the full parameterisation of an experiment without reading code.

provider:
  # "ollama" (local HTTP) or "claude_cli" (the Claude Code CLI in non-interactive mode).
  # No hosted AI APIs are used anywhere in this project.
  #
  # Model ids are pinned to dated snapshots, never to moving aliases like "sonnet" or
  # "claude-sonnet-4-5": an alias resolves to whatever is current, so a reviewer running
  # this later would silently get a different model and different numbers.
  name: claude_cli
  ollama:
    base_url: http://localhost:11434
    model: gemma4:12b
    temperature: 0.0
    seed: 42
  claude_cli:
    binary: claude
    model: claude-sonnet-4-5-20250929

# The measurement instrument must not share a model with the system it measures - a model
# grading its own output is not a measurement. The judge therefore runs on the provider
# the interviewer is not using.
judge:
  provider: ollama

interview:
  total_seconds: 1500          # 25 minutes
  answer_deadline_seconds: 120 # constant, never recalculated (D6)
  turn_overhead_seconds: 15    # time the interviewer itself consumes per turn
  max_followups_per_slot: 1
  # The budget technically fits ~10 primary questions at 135 s each. Six leaves room for
  # follow-ups; competencies beyond the sixth are recorded in slots.yaml as excluded.
  max_slots: 6
  # The opening answer is replayed verbatim, so it is charged a constant time cost too.
  opening_answer_seconds: 100

role: roles/fullstack
case: evals/cases/case-01
